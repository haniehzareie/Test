name: Update V2Ray Configs

on:
  schedule:
    # هر ۱۵ دقیقه یکبار اجرا بشه
    - cron: '*/15 * * * *'
  workflow_dispatch:  # برای اجرای دستی از دکمه

permissions:
  contents: write

jobs:
  extract-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run extractor script
        run: |
          python v2ray_extractor.py
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add v2ray_configs.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update v2ray configs $(date '+%Y-%m-%d %H:%M:%S')"
          git push
