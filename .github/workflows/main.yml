name: Save Config File

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  create-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create configonline.txt
        run: |
          echo "============================================" > configonline.txt
          echo "CONFIG FILE GENERATED BY DEEPSEEK" >> configonline.txt
          echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> configonline.txt
          echo "============================================" >> configonline.txt
          echo "" >> configonline.txt
          echo "Setting 1: enabled" >> configonline.txt
          echo "Setting 2: debug_mode = true" >> configonline.txt
          echo "Setting 3: max_retries = 3" >> configonline.txt
          echo "Setting 4: timeout = 30" >> configonline.txt
          echo "" >> configonline.txt
          echo "API Endpoint: https://api.example.com/v1" >> configonline.txt
          echo "Status: active" >> configonline.txt
          echo "============================================" >> configonline.txt
      
      - name: Commit and push config file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add configonline.txt
          git commit -m "Add configonline.txt [skip ci]" || echo "No changes to commit"
          git push
